spring:
  application:
    name: CareerSim
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3307/careersim?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

logging:
  level:
    org.flywaydb: DEBUG